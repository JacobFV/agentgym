<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>agentgym</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #fbfaf7; --card: #ffffff; --line: #ebe8e1; --fg: #0f0f10; --fg-2: #5b5a57; --fg-3: #9a978f;
    --red: #e5484d; --red-bg: #fff0f0; --amber: #f5a524; --amber-bg: #fff7e6; --green: #12a150; --green-bg: #eafaf0;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 28px; }
  .num { font-variant-numeric: tabular-nums; }
  .mono { font-family: var(--mono); font-size: 13px; }

  nav { display: flex; align-items: center; gap: 14px; padding: 22px 0; }
  .brand { font-weight: 800; font-size: 18px; letter-spacing: -.02em; }
  .spacer { flex: 1; }
  .chip { font-size: 12.5px; color: var(--fg-2); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--fg-3); }
  .chip.live .dot { background: var(--green); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  button { font: inherit; font-size: 14px; font-weight: 600; background: var(--fg); color: #fff; border: 0; border-radius: 999px; padding: 9px 18px; cursor: pointer; }
  button:disabled { opacity: .3; cursor: default; }

  .hero { padding: 48px 0 36px; }
  .eyebrow { font-size: 14px; font-weight: 600; color: var(--fg-3); letter-spacing: .02em; }
  h1 { font-size: clamp(36px, 5.2vw, 62px); line-height: 1.05; letter-spacing: -.035em; font-weight: 800; margin: 12px 0 0; max-width: 1000px; }
  h1 .red { color: var(--red); } h1 .green { color: var(--green); }

  .story { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  @media (max-width: 860px) { .story { grid-template-columns: 1fr; } nav .faint { display: none; } }
  .beat { border: 1px solid var(--line); border-radius: 24px; padding: 28px 28px 24px; }
  .beat .step { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
  .beat .big { font-size: 88px; font-weight: 800; letter-spacing: -.05em; line-height: 1; margin: 18px 0 12px; }
  .beat .what { font-size: 19px; font-weight: 600; line-height: 1.3; letter-spacing: -.01em; }
  .beat .who { margin-top: 18px; font-size: 13px; color: var(--fg-2); opacity: .75; }
  .beat.caught { background: var(--red-bg); border-color: #ffd9d9; } .beat.caught .step, .beat.caught .big { color: var(--red); }
  .beat.diag { background: var(--amber-bg); border-color: #ffe7b3; } .beat.diag .step { color: #b7791f; } .beat.diag .big { color: #c27c0e; }
  .beat.verdict { background: var(--green-bg); border-color: #c8f0d6; } .beat.verdict .step, .beat.verdict .big { color: var(--green); }

  .evidence { border-top: 1px solid var(--line); margin-top: 36px; padding: 24px 0 60px; }
  .evidence summary { cursor: pointer; font-weight: 600; font-size: 15px; list-style: none; display: flex; align-items: center; gap: 10px; }
  .evidence summary::-webkit-details-marker { display: none; }
  .evidence summary::before { content: "+"; display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); font-weight: 500; }
  .evidence[open] summary::before { content: "–"; }
  .ev-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; margin-top: 20px; align-items: start; }
  @media (max-width: 860px) { .ev-grid { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px 22px; }
  .card h4 { margin: 0 0 12px; font-size: 12px; color: var(--fg-3); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 8px 6px; text-align: right; border-bottom: 1px solid #f3f1ec; }
  th:first-child, td:first-child { text-align: left; padding-left: 0; }
  th { font-size: 12px; color: var(--fg-3); font-weight: 500; line-height: 1.3; }
  th b { color: var(--fg); }
  tr.total td { font-weight: 700; border-bottom: 0; }
  .bad { color: var(--red); font-weight: 700; }
  .cand { padding: 10px 0; border-bottom: 1px solid #f3f1ec; font-size: 14px; }
  .cand:last-child { border-bottom: 0; }
  .tag { font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-right: 6px; }
  .tag.r { background: var(--red-bg); color: var(--red); } .tag.g { background: var(--green-bg); color: var(--green); } .tag.a { background: var(--amber-bg); color: #b7791f; }
  .muted { color: var(--fg-2); } .faint { color: var(--fg-3); font-size: 13px; }
  pre { white-space: pre-wrap; margin: 16px 0 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; font: 12px/1.5 var(--mono); max-height: 220px; overflow: auto; }
  pre:empty { display: none; }
  footer { font-size: 12.5px; color: var(--fg-3); margin-top: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <span class="brand">agentgym</span>
    <span class="faint">coding agents improve software. agentgym improves the coding agents.</span>
    <span class="spacer"></span>
    <span id="mode" class="chip"><span class="dot"></span><span id="modeText">replay</span></span>
    <button id="run" title="Starts a real evolution run against the sponsor APIs (~10–15 min)">Run evolution</button>
  </nav>

  <section class="hero">
    <div class="eyebrow" id="eyebrow">Latest run</div>
    <h1 id="headline">Loading…</h1>
  </section>

  <section class="story" id="story"></section>

  <details class="evidence">
    <summary>See the evidence</summary>
    <div class="ev-grid">
      <div class="card"><h4>New, unseen tasks · passing runs</h4><div id="evals"></div></div>
      <div class="card"><h4>Proposed fixes</h4><div id="muts"></div></div>
    </div>
    <pre id="log"></pre>
    <footer id="footer"></footer>
  </details>
</div>
<script>
const $ = (id) => document.getElementById(id);
// ?scale=1.5 enlarges everything for projectors / recordings
const _scale = Number(new URLSearchParams(location.search).get("scale")); if (_scale > 0) document.body.style.zoom = _scale;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const human = (w) => ({ missed_error_paths: "unhandled error & cancel paths", ignored_stated_constraints: "ignored requirements", broke_existing_behavior: "breaking existing behavior", missed_edge_cases: "missed edge cases", overfit_visible_tests: "stopping at green tests", cross_module_contract: "cross-module contracts", output_format_or_tooling: "tool use", environment: "environment" }[w] || w);

function render({ record: r, running }) {
  $("run").disabled = running;
  $("mode").className = "chip" + (running ? " live" : "");
  $("modeText").textContent = running ? "Live run in progress" : r ? "Replay of a recorded run" : "No runs yet";
  if (!r) { $("headline").textContent = "No runs yet. Press Run evolution."; return; }
  const d = r.diagnosis;
  const fails = r.devTotals.runs - r.devTotals.runPasses;
  const over = r.devTotals.selfReportOverclaims;
  const weak = d.recurring.weakness;
  const p = d.recurring.probabilities[weak];
  const n = r.proposals.length;
  const promoted = r.promoted;
  const regressions = r.decisions.filter((x) => x.regressions?.length).length;

  $("eyebrow").textContent = `Latest run · coding agent ${r.parent} on Meta ${r.coder.model}`;
  $("headline").innerHTML = promoted
    ? `The agent <span class="red">said “done”</span> when it wasn’t. agentgym found why, fixed it, and <span class="green">proved the fix</span>.`
    : `The agent <span class="red">said “done” ${over}×</span> when it wasn’t. agentgym found why, and <span class="green">refused to ship</span> an unproven fix.`;

  $("story").innerHTML = `
    <div class="beat caught"><div class="step">1 · Caught</div><div class="big num">${over}/${fails}</div>
      <div class="what">failures the agent swore were fixed</div><div class="who">independent grader · hidden tests</div></div>
    <div class="beat diag"><div class="step">2 · Diagnosed</div><div class="big num">${Math.round(p * 100)}%</div>
      <div class="what">confident the root cause is ${esc(human(weak))}</div><div class="who">Subquadratic SubQ Snap · ${d.perTrace.length} traces, one read</div></div>
    <div class="beat verdict"><div class="step">3 · Verified</div><div class="big num">${promoted ? 1 : 0}/${n}</div>
      <div class="what">${promoted ? `fix shipped: ${esc(promoted)}` : `fixes shipped. None beat the original on new tasks${regressions ? `, ${regressions} broke one` : ""}.`}</div><div class="who">Meta writes fixes · the gate decides</div></div>`;

  const cols = [{ version: r.parent, role: "original", totals: r.parentVal.totals, perTask: r.parentVal.perTask }, ...r.candidateVals.map((c) => ({ ...c, role: "fix" }))];
  const tasks = Object.keys(r.parentVal.perTask);
  $("evals").innerHTML = `<table><thead><tr><th></th>${cols.map((c) => `<th><b>${esc(c.version)}</b><br>${c.role}</th>`).join("")}</tr></thead><tbody>
    ${tasks.map((t) => `<tr><td class="mono">${esc(t)}</td>${cols.map((c) => { const [a] = c.perTask[t].split("/").map(Number); const [pa] = r.parentVal.perTask[t].split("/").map(Number); return `<td class="num ${a < pa ? "bad" : ""}">${c.perTask[t]}</td>`; }).join("")}</tr>`).join("")}
    <tr class="total"><td>Total</td>${cols.map((c) => `<td class="num">${c.totals.runPasses}/${c.totals.runs}</td>`).join("")}</tr></tbody></table>`;

  $("muts").innerHTML = r.proposals.map((pr) => {
    const dec = r.decisions.find((x) => x.candidate === pr.candidateVersion);
    const rev = r.reviews?.[pr.id]?.report;
    const why = !pr.guard.ok ? "blocked by guard" : dec?.regressions?.length ? `broke ${dec.regressions.join(", ")}` : dec?.decision === "PROMOTE" ? "beat the original" : "no gain over original";
    return `<div class="cand"><span class="tag ${dec?.decision === "PROMOTE" ? "g" : "r"}">${dec?.decision === "PROMOTE" ? "Shipped" : "Rejected"}</span><b>${esc(pr.candidateVersion)}</b> <span class="faint">· ${esc(why)}</span>${rev?.risk === "high" ? ` <span class="tag a">Gemini: overfit risk</span>` : ""}<div class="muted" style="margin-top:4px">${esc(pr.proposedChange)}</div></div>`;
  }).join("");

  $("footer").innerHTML = `${esc(r.runId)} · SubQ ${esc(d.analyzer.model)} read ${d.analyzer.inputTokens.toLocaleString()} tokens · Meta ${esc(r.mutator.model)} wrote ${n} fixes · Gemini reviewed them · every model call logged in <span class="mono">results/llm-calls.jsonl</span> · replays are recorded runs, not fresh executions`;
}

async function refresh() { render(await (await fetch("/api/latest")).json()); }
$("run").onclick = async () => { $("log").textContent = ""; await fetch("/api/evolve", { method: "POST" }); document.querySelector(".evidence").open = true; refresh(); };
const es = new EventSource("/api/events");
es.onmessage = (m) => {
  const e = JSON.parse(m.data);
  const line = e.type === "log" ? e.msg.trim() : e.type === "task_graded" ? `graded ${e.taskId}@${e.version}#${e.rep}: ${e.passed ? "PASS" : "FAIL"}${e.selfReported && !e.passed ? " (agent claimed success)" : ""}` : e.type === "error" ? `ERROR ${e.msg}` : null;
  if (line) { $("log").textContent += `${e.t.slice(11, 19)}  ${line}\n`; $("log").scrollTop = 1e9; }
  if (e.type === "evolution_end" || e.type === "error") setTimeout(refresh, 300);
};
refresh();
</script>
</body>
</html>
